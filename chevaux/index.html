<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Le Ranch des Chevaux</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#b9dcef;font-family:system-ui,"Segoe UI",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  [hidden]{display:none!important}
  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.7)}
  #obj{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(40,28,14,.6);padding:8px 18px;border-radius:20px;font-size:17px;font-weight:600;max-width:60vw;text-align:center}
  #timer{position:absolute;top:12px;right:18px;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  #timer small{display:block;font-size:14px;color:#ffd0a0}
  #dir{position:absolute;top:66px;left:50%;transform:translateX(-50%);text-align:center;font-size:14px;font-weight:600}
  #dirA{display:block;font-size:34px;line-height:36px;color:#ffe066}
  #msg{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:34px;font-weight:800;opacity:0}
  #msg.big{font-size:90px}
  #jh{position:absolute;top:44%;left:0;right:0;text-align:center;font-size:40px;font-weight:900;color:#7dff7d}
  #gaitBox{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);text-align:center}
  #gaits span{display:inline-block;padding:4px 10px;margin:0 2px;border-radius:10px;background:rgba(0,0,0,.35);font-weight:700;font-size:14px;opacity:.55}
  #gaits span.on{background:#ffe066;color:#3a2a14;opacity:1;text-shadow:none}
  #enBar{width:260px;height:10px;margin:6px auto 0;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden}
  #enFill{height:100%;width:100%;background:linear-gradient(90deg,#ff6a3d,#ffe066,#6fdc6f)}
  #enT{font-size:12px;font-weight:700}
  #help{position:absolute;left:14px;bottom:12px;font-size:13px;line-height:1.5;opacity:.85;max-width:30vw}
  #help b{background:rgba(255,255,255,.2);border-radius:4px;padding:0 5px}
  /* écurie */
  #st{position:fixed;inset:0;pointer-events:none}
  .pnl{pointer-events:auto;position:absolute;background:rgba(48,32,16,.85);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;box-sizing:border-box;overflow:auto}
  #stL{left:max(12px,env(safe-area-inset-left));top:12px;width:300px;max-height:calc(100% - 24px)}
  #stR{right:max(12px,env(safe-area-inset-right));top:12px;width:300px;max-height:calc(100% - 24px)}
  #stSub{left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));text-align:center}
  #stMk{right:max(12px,env(safe-area-inset-right));top:12px;bottom:12px;width:min(430px,calc(100% - 24px))}
  .hn input{font:inherit;font-size:22px;font-weight:800;background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.35);color:#fff;width:100%;padding:0 0 2px}
  .hn small{display:block;opacity:.75;margin:2px 0 10px}
  .bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px;font-weight:600}
  .bar span{width:72px}
  .bar div{flex:1;height:12px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}
  .bar i{display:block;height:100%}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .bt{font:inherit;font-weight:700;font-size:15px;padding:9px 10px;border-radius:11px;border:0;background:#f4d58d;color:#3a2a14;cursor:pointer}
  .bt:hover{filter:brightness(1.08)}
  .bt.alt{background:rgba(255,255,255,.2);color:#fff}
  .bt:disabled{opacity:.4;cursor:default}
  .bt.wide{width:100%;margin-top:12px}
  .tip{margin-top:10px;font-size:13px;line-height:1.4;color:#ffe9b0;min-height:18px}
  h3{margin:12px 0 6px;font-size:16px}
  #ptsLine{font-size:17px;font-weight:800}
  .act{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:7px 10px;margin:5px 0;cursor:pointer}
  .act:hover{background:rgba(255,255,255,.2)}
  .act .e{font-size:26px}
  .act b{display:block;font-size:15px}
  .act small{display:block;font-size:12px;opacity:.8;line-height:1.3}
  .act em{font-style:normal;color:#ffe066}
  .chk{display:block;margin-top:10px;font-size:14px}
  .food{display:inline-flex;flex-direction:column;align-items:center;margin:6px;min-width:92px}
  .food .e{font-size:30px}
  .food small{font-weight:500;font-size:11px;opacity:.85}
  .mk{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:8px;margin:6px 0}
  .mk.cur{border-color:#ffe066}
  .sw{width:46px;height:46px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.5)}
  .mi{flex:1;font-size:13px}
  .mi b{font-size:15px}
  .sb{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:2px}
  .sb span{width:58px;opacity:.85}
  .sb div{flex:1;height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden}
  .sb i{display:block;height:100%;background:#ffe066}
  .mb{display:flex;flex-direction:column;gap:5px}
  .mb .bt{font-size:13px;padding:6px 8px}
  /* panneaux */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,20,10,.55);overflow:auto;padding:16px;box-sizing:border-box}
  .box{background:rgba(48,32,16,.95);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:22px 26px;max-width:640px;width:100%;box-sizing:border-box;max-height:100%;overflow:auto}
  .box h1{margin:0 0 6px;font-size:28px}
  .sub{opacity:.85;margin:0 0 12px;line-height:1.45}
  table{border-collapse:collapse;margin:10px 0;width:100%}
  td{padding:4px 10px;border-bottom:1px solid rgba(255,255,255,.15)}
  tr.me td{color:#ffe066;font-weight:700}
  .box .bt{margin:8px 8px 0 0;padding:10px 20px}
  /* tactile */
  #touch{display:none;position:fixed;inset:0;pointer-events:none}
  body.touch.playing #touch{display:block}
  body.touch #help,body.touch #quitBtn{display:none}
  #padL,#padR{position:absolute;top:0;bottom:0;pointer-events:auto;touch-action:none}
  #padL{left:0;width:45%} #padR{right:0;width:55%}
  #joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.75);transform:translate(-50%,-50%)}
  .tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(40,28,14,.5);color:#fff;font:700 13px system-ui,sans-serif;width:84px;height:84px;padding:0}
  .tb.on{background:rgba(255,224,102,.85);color:#3a2a14}
  #tJump{right:max(22px,env(safe-area-inset-right));bottom:24px}
  #tView{left:calc(max(12px,env(safe-area-inset-left)) + 52px);top:10px;width:44px;height:44px;font-size:11px}
  #tPause{left:max(12px,env(safe-area-inset-left));top:10px;width:44px;height:44px}
  body.touch #obj{font-size:14px;top:8px;max-width:54vw;padding:6px 12px}
  body.touch #gaitBox{bottom:10px}
  body.touch #gaits span{font-size:12px;padding:3px 7px}
  #rot{display:none;position:fixed;inset:0;background:#3a2a14;z-index:10;align-items:center;justify-content:center;font-size:22px;font-weight:700;text-align:center;padding:20px}
  @media (orientation:portrait) and (max-width:600px){ body.touch #rot{display:flex} }
  @media (max-width:880px){
    #stL,#stR{width:235px;padding:9px 10px;font-size:13px}
    .hn input{font-size:18px} .bt{font-size:13px;padding:7px 6px} .act{padding:5px 7px} .act .e{font-size:20px} .act small{display:none}
    .bar span{width:60px} h3{margin:8px 0 4px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="obj"></div>
  <div id="timer"></div>
  <div id="dir"><span id="dirA">▲</span><span id="dirD"></span></div>
  <div id="msg"></div>
  <div id="jh" hidden>SAUTE !</div>
  <div id="gaitBox">
    <div id="gaits"><span>Recul</span><span>Arrêt</span><span>Pas</span><span>Trot</span><span>Galop</span></div>
    <div id="enBar"><div id="enFill"></div></div><div id="enT">Énergie</div>
  </div>
  <div id="help"></div>
  <button id="quitBtn" class="bt alt" style="position:absolute;top:12px;left:12px;pointer-events:auto">II Pause / Quitter</button>
</div>

<div id="st" hidden>
  <div class="pnl" id="stL">
    <div class="hn"><input id="hName" maxlength="16" aria-label="Nom du cheval"><small id="hBreed"></small></div>
    <div id="bars"></div>
    <div class="row">
      <button class="bt" data-sub="brush">✨ Brosser</button>
      <button class="bt" data-sub="feed">🥕 Nourrir</button>
      <button class="bt" data-sub="saddle" id="bSaddle">🏇 Seller</button>
      <button class="bt" id="bRest">💤 Reposer</button>
    </div>
    <div class="tip" id="stTip"></div>
  </div>
  <div class="pnl" id="stR">
    <div id="ptsLine"></div>
    <h3>Activités</h3><div id="actsA"></div>
    <h3>Concours 🏆</h3><div id="actsC"></div>
    <button class="bt wide" id="bMarket">🐎 Mes chevaux et le marché</button>
    <label class="chk"><input type="checkbox" id="voice"> Voix du moniteur</label>
    <a class="bt wide alt" href="../" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">🏠 Quitter (retour aux jeux)</a>
  </div>
  <div class="pnl" id="stSub" hidden></div>
  <div class="pnl" id="stMk" hidden></div>
</div>

<div id="panel" class="overlay" hidden><div class="box" id="panelBox"></div></div>

<div id="touch">
  <div id="padL"></div><div id="padR"></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <button class="tb" id="tPause">II</button><button class="tb" id="tView">VUE</button>
  <button class="tb" id="tJump">SAUT</button>
</div>
<div id="rot">Tourne ton écran à l'horizontale pour jouer 🐴</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v)), lerp = (a,b,t) => a + (b-a)*t;
const smooth = (a,b,x) => { x = clamp((x-a)/(b-a), 0, 1); return x*x*(3-2*x); };
let seed = 4242;
const rnd = () => { seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; };
const fmt = t => { const m = Math.floor(t/60), s = t - m*60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const angDiff = a => { while (a > Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; };

/* ---------- les chevaux ---------- */
const BREEDS = [
  { id:'welsh',   breed:'Poney Welsh',      name:'Caramel',     price:0,    size:.86, coat:0xb4652c, mane:0xe9c78f, blaze:true, socks:[2,3], speed:13,   jump:1.0,  agil:1.2,  endur:1.1 },
  { id:'hafl',    breed:'Haflinger',        name:'Noisette',    price:150,  size:.93, coat:0xc98b3e, mane:0xf4e6c2, blaze:true, socks:[],    speed:13.6, jump:1.05, agil:1.12, endur:1.35 },
  { id:'paint',   breed:'Paint Horse',      name:'Pinto',       price:300,  size:1,   coat:0x3b2a20, mane:0x2a1d16, patches:true, blaze:true, socks:[0,1,2,3], speed:14.3, jump:1.12, agil:1.1, endur:1.15 },
  { id:'appa',    breed:'Appaloosa',        name:'Étoile',      price:450,  size:1,   coat:0xefebe3, mane:0x6d5a4a, spots:0x3b2c22, socks:[], speed:14.6, jump:1.18, agil:1.05, endur:1.2 },
  { id:'pursang', breed:'Pur-sang anglais', name:'Tornade',     price:650,  size:1.05, coat:0x7b3b1d, mane:0x17120f, leg:0x17120f, star:true, socks:[], speed:16.5, jump:1.1, agil:.95, endur:.95 },
  { id:'frison',  breed:'Frison',           name:'Ombre',       price:800,  size:1.1, coat:0x17130f, mane:0x0b0908, feather:true, socks:[], speed:14.6, jump:1.28, agil:.95, endur:1.35 },
  { id:'lipi',    breed:'Lipizzan',         name:'Perle',       price:1000, size:1.02, coat:0xe8e5de, mane:0xf7f5f0, socks:[], speed:15.4, jump:1.4, agil:1.25, endur:1.15 },
  { id:'licorne', breed:'Licorne',          name:'Arc-en-ciel', price:2000, size:1.04, coat:0xfbfaff, mane:'rainbow', horn:true, socks:[], speed:17.5, jump:1.6, agil:1.3, endur:1.5 },
];
const B = id => BREEDS.find(b => b.id === id) || BREEDS[0];
const hex = c => '#' + c.toString(16).padStart(6, '0');

/* ---------- sauvegarde ---------- */
const newCare = name => ({ name, faim:70, prop:40, bonheur:70, energie:100, tack:{ pad:false, saddle:false, girth:false, bridle:false } });
let save = { pts:0, ros:0, owned:{}, cur:'welsh', best:{}, voice:true, seen:false };
try { Object.assign(save, JSON.parse(localStorage.getItem('ranch.save') || '{}')); } catch(e) {}
if (!save.owned.welsh) save.owned.welsh = newCare('Caramel');
if (!save.owned[save.cur]) save.cur = 'welsh';
const store = () => { try { localStorage.setItem('ranch.save', JSON.stringify(save)); } catch(e) {} };
const care = () => save.owned[save.cur];
const curB = () => B(save.cur);
const saddled = c => c.tack.pad && c.tack.saddle && c.tack.girth && c.tack.bridle;

/* ---------- le monde ---------- */
const WORLD = 250;
const ZONES = [ { cx:0, cz:0, hx:13, hz:10 }, { cx:95, cz:0, hx:39, hz:25 }, { cx:-70, cz:0, hx:17, hz:37 }, { cx:-28, cz:22, hx:13, hz:13 } ];
const TR = { cx:0, cz:150, a:72, b:42 };               // piste de course (ellipse)
const PATHS = [[0,7,0,104], [0,7,55,0], [0,7,-52,0]];
function zoneDist(x,z){
  let d = 1e9;
  for (const r of ZONES) d = Math.min(d, Math.hypot(Math.max(Math.abs(x-r.cx) - r.hx, 0), Math.max(Math.abs(z-r.cz) - r.hz, 0)));
  const e = Math.hypot((x-TR.cx)/(TR.a+12), (z-TR.cz)/(TR.b+12));
  return Math.min(d, Math.max(0, (e-1)*(TR.b+12)));
}
function segDist(x,z,x0,z0,x1,z1){ const dx = x1-x0, dz = z1-z0, t = clamp(((x-x0)*dx + (z-z0)*dz)/(dx*dx + dz*dz), 0, 1); return Math.hypot(x-x0-dx*t, z-z0-dz*t); }
const pathDist = (x,z) => Math.min(...PATHS.map(p => segDist(x, z, p[0], p[1], p[2], p[3])));
const hills = (x,z) => 3.6*Math.sin(x*.019+.5)*Math.cos(z*.017) + 1.8*Math.sin(x*.043+1.3)*Math.sin(z*.039+.7) + .5*Math.sin(x*.1)*Math.cos(z*.12);
const ground = (x,z) => hills(x,z) * smooth(5, 32, Math.min(zoneDist(x,z), pathDist(x,z)*2.5));

const renderer = new THREE.WebGLRenderer({ canvas:$('c'), antialias:true });
const LOW = matchMedia('(pointer:coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, LOW ? 1.5 : 2));
renderer.shadowMap.enabled = !LOW; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9dcef);
scene.fog = new THREE.Fog(0xb9dcef, 80, 340);
const camera = new THREE.PerspectiveCamera(68, 1, .05, 1200);
camera.rotation.order = 'YXZ'; scene.add(camera);
const hemi = new THREE.HemisphereLight(0xdcefff, 0x6b7a4a, .95); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, .8); sun.position.set(60, 100, 40); scene.add(sun); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004; sun.shadow.normalBias = .05;
Object.assign(sun.shadow.camera, { left:-45, right:45, top:45, bottom:-45, near:1, far:340 }); sun.shadow.camera.updateProjectionMatrix();
const barnLight = new THREE.PointLight(0xffe2b0, 0, 24); barnLight.position.set(0, 3.4, 0); scene.add(barnLight);
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const L = c => new THREE.MeshLambertMaterial({ color:c });
const sph = new THREE.SphereGeometry(1, 14, 10);
const cyl = (a,b,h,n) => new THREE.CylinderGeometry(a, b, h, n || 10);
const box = (w,h,d) => new THREE.BoxGeometry(w, h, d);
function mesh(geo, mat, x, y, z, parent){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = true; (parent || scene).add(m); return m; }
const E = (par, m, x,y,z, sx,sy,sz) => { const o = mesh(sph, m, x,y,z, par); o.scale.set(sx,sy,sz); return o; };
const canvasTex = (w, h, draw) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h); return new THREE.CanvasTexture(cv); };
const noiseTex = (base, n, lo, hi, rep) => { const t = canvasTex(256, 256, c => { c.fillStyle = base; c.fillRect(0,0,256,256); for (let i = 0; i < n; i++){ const v = lo + Math.random()*(hi-lo) | 0; c.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; c.globalAlpha = .35; c.fillRect(Math.random()*256, Math.random()*256, 1 + Math.random()*2, 2 + Math.random()*3); } }); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); return t; };
function textSprite(txt, bg, w){
  const cv = document.createElement('canvas'); cv.width = w || 128; cv.height = 128;
  const c = cv.getContext('2d'); c.fillStyle = bg; c.beginPath();
  if (w) c.rect(0, 24, w, 80); else c.arc(64, 64, 58, 0, 7);
  c.fill(); c.fillStyle = '#fff'; c.font = 'bold ' + (w ? 54 : 76) + 'px system-ui,Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(txt, cv.width/2, 68);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv) }));
  s.scale.set(w ? w/128*1.2 : .9, w ? 1.2 : .9, 1); scene.add(s); return s;
}

// ciel, nuages, montagnes
const backdrop = new THREE.Group(); scene.add(backdrop);
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(520, 24, 14), new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 vP;void main(){float h=normalize(vP).y;vec3 c=mix(vec3(.80,.90,.96),vec3(.22,.52,.90),smoothstep(0.,.6,h));c=mix(vec3(.725,.86,.94),c,smoothstep(-.02,.07,h));gl_FragColor=vec4(c,1.);}' }));
  sky.renderOrder = -10; sky.frustumCulled = false; backdrop.add(sky);
  const N = 96, pos = [], col = [], idx = [];
  for (let i = 0; i <= N; i++){
    const a = i/N*Math.PI*2, h = 30 + 22*Math.sin(a*5 + 1) + 14*Math.sin(a*11 + 2) + 8*Math.sin(a*23), x = Math.cos(a)*470, z = Math.sin(a)*470;
    pos.push(x, -10, z, x, h, z); col.push(.72,.85,.93, .5,.64,.8);
    if (i < N){ const k = i*2; idx.push(k, k+1, k+2, k+1, k+3, k+2); }
  }
  const mg = new THREE.BufferGeometry(); mg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); mg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); mg.setIndex(idx);
  const mt = new THREE.Mesh(mg, new THREE.MeshBasicMaterial({ vertexColors:true, fog:false, side:THREE.DoubleSide })); mt.frustumCulled = false; mt.renderOrder = -9; backdrop.add(mt);

const segs = [];
function addSeg(x0,z0,x1,z1,top){ segs.push({ x0, z0, x1, z1, top:top || 1.3, minx:Math.min(x0,x1), maxx:Math.max(x0,x1), minz:Math.min(z0,z1), maxz:Math.max(z0,z1) }); }
const grid = new Map(), CELL = 8, gkey = (i,j) => i*4096 + j;
function addCol(x,z,r){ const k = gkey(Math.floor(x/CELL)+512, Math.floor(z/CELL)+512); if (!grid.has(k)) grid.set(k, []); grid.get(k).push({ x, z, r }); }
function nearCol(x,z,m){
  const ci = Math.floor(x/CELL)+512, cj = Math.floor(z/CELL)+512;
  for (let i = ci-1; i <= ci+1; i++) for (let j = cj-1; j <= cj+1; j++){ const a = grid.get(gkey(i,j)); if (a) for (const o of a) if (Math.hypot(x-o.x, z-o.z) < o.r + m) return true; }
  return false;
}
function collide(o, r){
  for (const s of segs){
    if (o.h > s.top || o.x < s.minx - r || o.x > s.maxx + r || o.z < s.minz - r || o.z > s.maxz + r) continue;
    const dx = s.x1-s.x0, dz = s.z1-s.z0, t = clamp(((o.x-s.x0)*dx + (o.z-s.z0)*dz)/(dx*dx + dz*dz), 0, 1);
    const cx = s.x0 + dx*t, cz = s.z0 + dz*t; let ex = o.x - cx, ez = o.z - cz, d = Math.hypot(ex, ez);
    if (d < r){ if (d < 1e-4){ ex = -dz; ez = dx; d = Math.hypot(ex, ez); } o.x = cx + ex/d*r; o.z = cz + ez/d*r; if (o.v) o.v *= .93; o.bump = .3; }
  }
  const ci = Math.floor(o.x/CELL)+512, cj = Math.floor(o.z/CELL)+512, rc = r*.85;
  for (let i = ci-1; i <= ci+1; i++) for (let j = cj-1; j <= cj+1; j++){
    const a = grid.get(gkey(i,j)); if (!a) continue;
    for (const c of a){ const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz), m = c.r + rc; if (d < m && d > 1e-4){ o.x = c.x + dx/d*m; o.z = c.z + dz/d*m; if (o.v) o.v *= .9; } }
  }
  const d = Math.hypot(o.x, o.z - 40);
  if (d > WORLD - 8){ o.x *= (WORLD-8)/d; o.z = 40 + (o.z - 40)*(WORLD-8)/d; }
}

const postL = [], railL = [];
function fence(x0,z0,x1,z1,col,noCol){
  const len = Math.hypot(x1-x0, z1-z0), n = Math.max(1, Math.round(len/3));
  for (let i = 0; i <= n; i++){ const x = lerp(x0,x1,i/n), z = lerp(z0,z1,i/n); postL.push([x, ground(x,z), z, col]); }
  const mx = (x0+x1)/2, mz = (z0+z1)/2, gy = ground(mx, mz);
  for (const y of [.55, 1.08]) railL.push([mx, gy + y, mz, -Math.atan2(z1-z0, x1-x0), len, col]);
  if (!noCol) addSeg(x0, z0, x1, z1, 1.3);
}
function fenceRect(cx, cz, hx, hz, col, gapSide, gap){
  const x0 = cx-hx, x1 = cx+hx, z0 = cz-hz, z1 = cz+hz;
  const side = (ax,az,bx,bz,s) => {
    if (s !== gapSide){ fence(ax,az,bx,bz,col); return; }
    const mx = (ax+bx)/2, mz = (az+bz)/2, len = Math.hypot(bx-ax, bz-az), ux = (bx-ax)/len, uz = (bz-az)/len;
    fence(ax, az, mx - ux*gap, mz - uz*gap, col); fence(mx + ux*gap, mz + uz*gap, bx, bz, col);
  };
  side(x0,z0,x1,z0,'n'); side(x1,z0,x1,z1,'e'); side(x1,z1,x0,z1,'s'); side(x0,z1,x0,z0,'w');
}
function buildFences(){

  const pm = new THREE.InstancedMesh(box(.14, 1.3, .14), new THREE.MeshLambertMaterial(), postL.length);

  const rm = new THREE.InstancedMesh(box(1, .1, .06), new THREE.MeshLambertMaterial(), railL.length);
  railL.forEach((r, i) => { e.set(0, r[3], 0); q.setFromEuler(e); m4.compose(v.set(r[0], r[1], r[2]), q, sc.set(r[4], 1, 1)); rm.setMatrixAt(i, m4); rm.setColorAt(i, c.setHex(r[5])); });

}
