<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragons Élémentaires : l'Arène</title>
<style>
:root{--panel:rgba(20,18,40,.9);--line:rgba(255,255,255,.18);--gold:#ffd24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud2d{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
[hidden]{display:none!important}
.shadow{text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 10px rgba(0,0,0,.35)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:linear-gradient(180deg,rgba(10,10,30,.25),rgba(10,10,30,.7))}
.mwrap{width:min(1200px,100%);max-height:100%;overflow:auto}
h1{margin:0;text-align:center;font-size:clamp(28px,4.5vw,50px);font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,#ff6a2a,#33ccff,#9ad35a,#e8fbff,#ffe14a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
.sub{text-align:center;margin:2px 0 12px;font-size:17px;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.wallet{color:var(--gold);font-size:20px}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;border:2px solid rgba(255,255,255,.3)}
.seg button{background:transparent;color:#fff;border:0;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:#fff;color:#222}
.num{display:inline-flex;align-items:center;gap:6px}
.num button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:inherit;font-weight:900;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:10px;text-align:center;position:relative}
.card.p1{border-color:var(--c);box-shadow:0 0 18px var(--c)}
.card.p2{border-style:dashed;border-color:var(--c)}
.card .ic{font-size:34px;line-height:1}
.card h2{margin:4px 0 0;font-size:19px;color:var(--c)}
.card .el{font-size:12px;opacity:.85;margin-bottom:6px}
.st{display:grid;grid-template-columns:58px 1fr;gap:5px;align-items:center;font-size:11px;text-align:left;margin-top:3px}
.st .sb{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.st .sb i{display:block;height:100%;background:var(--c)}
.atks{margin:8px 0;text-align:left;font-size:12px;line-height:1.55;background:rgba(0,0,0,.25);border-radius:8px;padding:5px 7px}
.atks b{display:inline-block;width:15px;color:var(--c)}
.upg{display:grid;grid-template-columns:20px 1fr auto;gap:4px;align-items:center;font-size:11px;margin-top:4px;text-align:left}
.pips{display:flex;gap:2px}
.pips i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.15)}
.pips i.on{background:var(--gold)}
.upg button{background:#3a2f10;border:1px solid var(--gold);color:var(--gold);border-radius:6px;font:inherit;font-size:11px;font-weight:700;padding:2px 6px;cursor:pointer;white-space:nowrap}
.upg button:disabled{opacity:.35;cursor:default}
.pick{display:flex;gap:6px;justify-content:center;margin-top:8px}
.pick button{flex:1;border:0;border-radius:999px;padding:6px 4px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff}
.pick button.on{background:var(--c);color:#111}
.go{display:flex;justify-content:center;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}
.big{background:linear-gradient(180deg,#ffcf3a,#ff7a1a);color:#2a1300;border:0;border-radius:14px;padding:12px 40px;font:inherit;font-size:24px;font-weight:900;letter-spacing:.06em;cursor:pointer;box-shadow:0 6px 0 #a3460a,0 10px 30px rgba(255,140,30,.4)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #a3460a}
.btn2{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:10px 22px;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.how{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.7;text-align:center}
kbd{background:#fff;color:#222;border-radius:5px;padding:0 6px;font-family:Consolas,monospace;font-weight:700;font-size:12px;box-shadow:0 2px 0 #999}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 26px;min-width:min(520px,100%);text-align:center}
.box h2{margin:0 0 10px;font-size:32px}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:16px}
td,th{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.1)}
th{font-size:13px;opacity:.7}
tr.me td{color:var(--gold);font-weight:800}
</style>
</head>
<body>
<canvas id="hud2d"></canvas>

<div id="menu" class="overlay">
  <div class="mwrap">
    <h1>DRAGONS ÉLÉMENTAIRES</h1>
    <div class="sub shadow">⚔️ L'Arène : choisis UN dragon, bats les autres, gagne des pièces et améliore-le !</div>
    <div class="bar">
      <span class="wallet">💰 <span id="wallet">0</span> pièces</span>
      <span>Joueurs <span class="seg" id="segMode"><button data-v="1">1 joueur</button><button data-v="2">2 joueurs</button></span></span>
      <span class="num">Bots <button id="botMinus">−</button><span id="botN">4</span><button id="botPlus">+</button></span>
      <span>Bots <span class="seg" id="segDiff"><button data-v="facile">Faciles</button><button data-v="normal">Normaux</button><button data-v="difficile">Forts</button></span></span>
      <span>Durée <span class="seg" id="segTime"><button data-v="120">2 min</button><button data-v="180">3 min</button><button data-v="300">5 min</button></span></span>
    </div>
    <div class="cards" id="cards"></div>
    <div class="go">
      <span id="pickTxt" class="shadow" style="font-weight:800"></span>
      <button class="big" id="btnFight">COMBATTRE !</button>
    </div>
    <div class="how" id="howTxt"></div>
  </div>
</div>

<div id="pause" class="overlay" hidden>
  <div class="box">
    <h2>⏸️ Pause</h2>
    <p>Les pièces déjà ramassées sont gardées.</p>
    <div class="go"><button class="big" id="btnResume">REPRENDRE</button><button class="btn2" id="btnQuit">Quitter le combat</button></div>
  </div>
</div>

<div id="results" class="overlay" hidden>
  <div class="box">
    <h2 id="resTitle">Fin du combat !</h2>
    <table><thead><tr><th>#</th><th>Dragon</th><th>Victoires</th><th>Défaites</th></tr></thead><tbody id="resBody"></tbody></table>
    <div id="resCoins" class="wallet" style="font-weight:800;margin:10px 0"></div>
    <div class="go"><button class="big" id="btnBack">AMÉLIORER MON DRAGON</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// =====================================================================
//  Rendu, ciel

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

const scene = new THREE.Scene();

const menuCam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 6000);
const sunDir = new V3(0.4, 0.75, -0.5).normalize();
scene.add(new THREE.HemisphereLight(0xdcefff, 0x5a4a35, 0.85));
const sun = new THREE.DirectionalLight(0xfff2dc, 1.0); sun.position.copy(sunDir).multiplyScalar(100); scene.add(sun);
const sky = new THREE.Mesh(new THREE.SphereGeometry(4500, 32, 16), new THREE.ShaderMaterial({

    float s=max(dot(d,sunDir),0.0); c+=vec3(1.0,0.9,0.7)*pow(s,350.0)*1.5+vec3(1.0,0.85,0.6)*pow(s,8.0)*0.2; gl_FragColor=vec4(c,1.0);} `
}));
scene.add(sky);
function radialTex(stops, size = 64) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.3, 'rgba(255,255,255,.65)'], [1, 'rgba(255,255,255,0)']]);

// =====================================================================
//  Terrain (vallée)
// =====================================================================
function hash2(i, j, s) { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(s, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);

}
function fbm(x, y, o, s = 1) { let t = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { t += (vnoise(x * f, y * f, s + i * 17) * 2 - 1) * a; n += a; a *= 0.5; f *= 2.03; } return t / n; }

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(5150);
const WORLD = 2800, SEG = 280, CELL = WORLD / SEG, HALF = WORLD / 2, GN = SEG + 1, LIMIT = 800;
function rawHeight(x, z) {
  const d = Math.hypot(x, z);
  let h = fbm(x / 520, z / 520, 5, 3) * 70 + 12;
  const m = smoothstep(0.0, 0.35, fbm(x / 1200 + 11.3, z / 1200 - 4.1, 3, 7));

for (let iz = 0; iz < GN; iz++) for (let ix = 0; ix < GN; ix++) HGT[iz * GN + ix] = rawHeight(-HALF + ix * CELL, -HALF + iz * CELL);

}
{
  const tg = new THREE.PlaneGeometry(WORLD, WORLD, SEG, SEG); tg.rotateX(-Math.PI / 2);
  const pos = tg.attributes.position;
  for (let i = 0; i < pos.count; i++) { const ix = Math.round((pos.getX(i) + HALF) / CELL), iz = Math.round((pos.getZ(i) + HALF) / CELL); pos.setY(i, HGT[iz * GN + ix]); }

{
  const N = 3000;
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.4, 2, 5); trunkGeo.translate(0, 1, 0);

  persist();
  const first = rank[0];
  $('#resTitle').textContent = quit ? 'Combat abandonné' : first.pl ? `🏆 ${first.name} gagne${first.name === 'Toi' ? 's' : ''} !` : `🏆 ${first.spec.icon} ${first.name} gagne !`;
  $('#resBody').innerHTML = rank.map((f, i) => `<tr class="${f.pl ? 'me' : ''}"><td>${i + 1}</td><td>${f.spec.icon} ${f.name}${f.isBot ? '' : ' ⭐'}</td><td>${f.kills}</td><td>${f.deaths}</td></tr>`).join('');
  $('#resCoins').innerHTML = txtCoins + `<div style="margin-top:6px">Total : 💰 ${save.coins}</div>`;
  $('#results').hidden = false;
}
function toMenu() {
  clearMatch(); state = 'menu';
  $('#results').hidden = true; $('#pause').hidden = true; $('#menu').hidden = false;
  buildCards();
}
$('#btnResume').onclick = resumeGame;
$('#btnQuit').onclick = () => endMatch(true);
$('#btnBack').onclick = toMenu;
$('#btnFight').onclick = startMatch;

// =====================================================================
//  Menu : choix du dragon + améliorations
// =====================================================================
function saveOpts() { saveOpt('dragonsArene.opts', opts); }
function segInit(id, key, parse) {
  const el = $(id);
  const sync = () => [...el.children].forEach(b => b.classList.toggle('on', String(opts[key]) === b.dataset.v));
  [...el.children].forEach(b => b.onclick = () => { opts[key] = parse ? parse(b.dataset.v) : b.dataset.v; saveOpts(); sync(); buildCards(); });
  sync();
}
segInit('#segMode', 'players', Number); segInit('#segDiff', 'diff'); segInit('#segTime', 'time', Number);
$('#botMinus').onclick = () => { opts.bots = Math.max(0, opts.bots - 1); saveOpts(); buildCards(); };
$('#botPlus').onclick = () => { opts.bots = Math.min(8, opts.bots + 1); saveOpts(); buildCards(); };
function buildCards() {
  $('#wallet').textContent = save.coins; $('#botN').textContent = opts.bots;
  const c = $('#cards'); c.innerHTML = '';
  const maxSp = 42 * 1.25, maxHp = 165 * 1.6;
  DRAGONS.forEach((d, i) => {
    const u = save.upg[d.id], st = statsOf(d, u);
    const el = document.createElement('div'); el.className = 'card' + (opts.p1 === i ? ' p1' : '') + (opts.players > 1 && opts.p2 === i ? ' p2' : ''); el.style.setProperty('--c', d.css);
    const bar = (l, v) => `<div class="st"><span>${l}</span><div class="sb"><i style="width:${clamp(v, 0, 1) * 100}%"></i></div></div>`;
    const keysL = ['1', '2', '3'];
    el.innerHTML = `<div class="ic">${d.icon}</div><h2>${d.name}</h2><div class="el">${d.el}${d.regen ? ' · se soigne' : ''}</div>
      ${bar('Vitesse', st.speed / maxSp)}${bar('Vie', st.maxHp / maxHp)}${bar('Puissance', (DPOW[d.id] / 5) * (0.8 + 0.2 * st.dmg))}
      <div class="atks">${d.atk.map((a, k) => `<div><b>${keysL[k]}</b>${a.ic} ${a.n}</div>`).join('')}</div>
      ${UPG.map(([k, ic, lab]) => { const lv = u[k], cost = upgCost(lv), full = lv >= MAXLVL;
        return `<div class="upg"><span title="${lab}">${ic}</span><div><div style="font-size:10px;opacity:.8">${lab}</div><div class="pips">${[0, 1, 2, 3, 4].map(n => `<i class="${n < lv ? 'on' : ''}"></i>`).join('')}</div></div>
        <button data-d="${d.id}" data-k="${k}" ${full || save.coins < cost ? 'disabled' : ''}>${full ? 'MAX' : '+ ' + cost + ' 💰'}</button></div>`; }).join('')}
      <div class="pick"><button class="j1 ${opts.p1 === i ? 'on' : ''}">${opts.players > 1 ? 'J1' : 'Choisir'}</button>${opts.players > 1 ? `<button class="j2 ${opts.p2 === i ? 'on' : ''}">J2</button>` : ''}</div>`;
    el.querySelector('.j1').onclick = () => { opts.p1 = i; saveOpts(); buildCards(); };
    if (opts.players > 1) el.querySelector('.j2').onclick = () => { opts.p2 = i; saveOpts(); buildCards(); };
    el.querySelectorAll('.upg button').forEach(b => b.onclick = () => buyUpgrade(b.dataset.d, b.dataset.k));
    el.onmouseenter = () => showPreview(i);
    c.appendChild(el);
  });
  const p1 = DRAGONS[opts.p1], p2 = DRAGONS[opts.p2];
  $('#pickTxt').innerHTML = opts.players > 1 ? `J1 : <span style="color:${p1.css}">${p1.icon} ${p1.name}</span> &nbsp; J2 : <span style="color:${p2.css}">${p2.icon} ${p2.name}</span> &nbsp; + ${opts.bots} bots`
    : `Ton dragon : <span style="color:${p1.css}">${p1.icon} ${p1.name}</span> &nbsp; contre ${opts.bots} bot${opts.bots > 1 ? 's' : ''}`;
  $('#howTxt').innerHTML = opts.players > 1
    ? `<b>Joueur 1</b> : <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> diriger · <kbd>Espace</kbd> <kbd>E</kbd> <kbd>R</kbd> attaques 1-2-3 · <kbd>Shift</kbd> turbo<br>
       <b>Joueur 2</b> : <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> diriger · <kbd>I</kbd> <kbd>O</kbd> <kbd>P</kbd> (ou pavé num. <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>) attaques · <kbd>Shift droit</kbd> / <kbd>0</kbd> turbo<br>
       🎮 Manettes : stick gauche, <b>A X B</b> attaques, gâchette turbo (1 manette = Joueur 2, 2 manettes = une chacun)`
    : `<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> ou <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> diriger · <kbd>Espace</kbd>/clic gauche attaque 1 · <kbd>E</kbd>/clic droit attaque 2 · <kbd>R</kbd> attaque 3 · <kbd>Shift</kbd> turbo · <kbd>Échap</kbd> pause<br>
       🎮 Manette : stick gauche, <b>A</b> <b>X</b> <b>B</b> attaques, gâchette turbo · Les attaques visent toutes seules !`;
  showPreview(opts.p1);
}
function buyUpgrade(id, k) {
  const lv = save.upg[id][k], cost = upgCost(lv);
  if (lv >= MAXLVL || save.coins < cost) return;
  save.coins -= cost; save.upg[id][k]++; persist(); initAudio(); sfxCoin(); buildCards();
}
let previewIdx = 0;
function showPreview(i) { previewIdx = i; previews.forEach((p, k) => p.root.visible = state === 'menu' && k === i); }

// =====================================================================
//  Boucle
// =====================================================================
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  hud2d.width = innerWidth * dpr; hud2d.height = innerHeight * dpr; W = innerWidth; H = innerHeight; h.setTransform(dpr, 0, 0, dpr, 0, 0);
  menuCam.aspect = W / H; menuCam.updateProjectionMatrix();
  const sc = innerHeight * renderer.getPixelRatio() / 2; glowP.mat.uniforms.scale.value = sc; mattP.mat.uniforms.scale.value = sc;
}
addEventListener('resize', resize);
resize(); buildCards();
let last = performance.now(), menuAng = 0;
function step(dt) {
  matchT -= dt;
  for (const pl of players) { readPlayer(pl, dt); pl.msgT -= dt; pl.hurt = Math.max(0, pl.hurt - dt); pl.hitMark = Math.max(0, pl.hitMark - dt); pl.turnT -= dt; }
  for (const f of fighters) if (f.isBot && f.alive) botThink(f, dt);
  for (const f of fighters) updateFighter(f, dt);
  updateShots(dt); updateCoins(dt);
  for (const e of feed) e.t -= dt; while (feed.length && feed[feed.length - 1].t <= 0) feed.pop();
  for (const f of fighters) if (f.alive) {
    animateDragon(f.d, dt, f.boosting || f.dashT > 0 ? 2.6 : f.pitch < -0.25 ? 0.5 : 1.3, f.boosting ? 0.75 : f.pitch < -0.25 ? 0.12 : 0.5, f.in.x, time);
    f.d.root.updateMatrixWorld(true); emitTrail(f.d, f.boosting ? 3 : 1);
  }
  if (matchT <= 0) endMatch(false);
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; time += dt;
  if (state === 'play') step(dt);
  glowP.update(state === 'pause' ? 0 : dt); mattP.update(state === 'pause' ? 0 : dt);
  if (state === 'menu' || state === 'results') {
    menuAng += dt * 0.35;
    const p = previews[previewIdx];
    p.root.position.set(0, 22 + Math.sin(time * 1.3) * 0.8, 0); p.root.rotation.set(0.05, 0.5, 0, 'YXZ');
    animateDragon(p, dt, 1.3, 0.5, 0, time);
    menuCam.position.set(Math.sin(menuAng) * 34, 34 + Math.sin(menuAng * 0.7) * 3, Math.cos(menuAng) * 34); menuCam.lookAt(0, 20, 0);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
    sky.position.copy(menuCam.position); renderer.render(scene, menuCam);
  } else {
    const n = players.length, vw = W / n;
    renderer.setScissorTest(true);
    players.forEach((pl, i) => {
      if (state === 'play') updatePlayerCam(pl, dt);
      pl.cam.aspect = vw / H; pl.cam.updateProjectionMatrix();
      renderer.setViewport(i * vw, 0, vw, H); renderer.setScissor(i * vw, 0, vw, H);
      sky.position.copy(pl.cam.position); renderer.render(scene, pl.cam);
    });
    renderer.setScissorTest(false);
  }
  drawHud();
}
requestAnimationFrame(frame);
</script>
